<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Translation Meta Tags (Removed 'notranslate' to allow translation) -->
    <meta name="robots" content="translate">
    <meta http-equiv="Content-Language" content="en">
    
    <title>Nova Tech</title>
    
    <!-- Favicon using the Leaf Logo -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+IS&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Translation Script -->
    <script>
        document.documentElement.lang = navigator.language || 'en';
        document.body.setAttribute('translate', 'yes');
        
        console.log('✅ Translation Ready');
        console.log('🌐 Browser Language:', navigator.language);
        console.log('📋 To translate: Right-click → "Translate to..."');
    </script>
</body>
</html>
